<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor 3D — Inés</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
model-viewer{width:100%;height:100%;background:#fff;--poster-color:#fff}
.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#777;font-size:12px;background:#ffffffdb;padding:8px 12px;border-radius:8px;pointer-events:none;white-space:nowrap}
#error{display:none;position:absolute;top:15px;left:15px;right:15px;color:#8b1d1d;background:#fff1f1;padding:12px;border-radius:8px}
</style>
</head>
<body>
<model-viewer src="./modelo.glb" alt="Modelo arquitectónico 3D" camera-controls touch-action="pan-y" shadow-intensity="0.8" exposure="1" environment-image="neutral" loading="eager" interaction-prompt="auto">
<div slot="poster" style="display:grid;place-items:center;height:100%;color:#777">Cargando modelo 3D…</div>
</model-viewer>
<div class="hint">Arrastra para girar · Desliza para acercar</div>
<div id="error">No se pudo cargar el modelo. Comprueba que modelo.glb e index.html están en la misma carpeta.</div>
<script>document.querySelector('model-viewer').addEventListener('error',()=>document.getElementById('error').style.display='block');</script>
</body></html>
